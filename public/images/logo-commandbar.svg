<svg xmlns="http://w3.org" width="23" height="23" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">
  <!-- Líquido (vinho) na parte inferior da taça -->
  <polygon points="9.6,10.5 14.4,10.5 12,13.5" fill="#8B001C" stroke="none" />
  
  <!-- Símbolo de terminal '>' -->
  <polyline points="3.5 9.5 6.5 12 3.5 14.5" />
  
  <!-- Linha inferior do prompt '_' -->
  <line x1="7.5" y1="13.5" x2="11.5" y2="13.5" />
  
  <!-- Taça de coquetel / vinho -->
  <polygon points="7.5 7.5 16.5 7.5 12 13.5" />
  <line x1="9.6" y1="10.5" x2="14.4" y2="10.5" />
  <line x1="12" y1="13.5" x2="12" y2="18.5" />
  <line x1="9.5" y1="18.5" x2="14.5" y2="18.5" />
  
  <!-- Cursor vertical '|' -->
  <line x1="19.5" y1="7.5" x2="19.5" y2="16.5" />
</svg>